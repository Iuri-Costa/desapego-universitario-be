spring.datasource.url=${TEST_JDBC_URL:jdbc:h2:mem:desapego;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true

app.cors.allowed-origins=http://localhost:5173

app.jwt.secret=segredo-fixo-apenas-para-testes-automaticos-1234567890
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D

app.rate-limit.login=1000
app.rate-limit.cadastro=1000
app.rate-limit.janela=PT1M
app.reserva.ttl=PT24H
