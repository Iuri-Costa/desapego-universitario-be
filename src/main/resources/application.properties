spring.application.name=desapegoUniversitario
spring.profiles.default=dev

server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=${JDBC_TIME_ZONE:UTC}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}

app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.auth=${MAIL_SMTP_AUTH:true}
app.mail.starttls=${MAIL_STARTTLS:true}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.token.verificacao-ttl=${EMAIL_VERIFICATION_TTL:PT24H}
app.token.redefinicao-ttl=${PASSWORD_RESET_TTL:PT1H}

app.rate-limit.login=${RATE_LIMIT_LOGIN:5}
app.rate-limit.cadastro=${RATE_LIMIT_CADASTRO:3}
app.rate-limit.janela=${RATE_LIMIT_JANELA:PT1M}
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

app.reserva.ttl=${RESERVA_TTL:PT24H}

app.cadastro.dominios-institucionais=${EMAIL_DOMINIOS_INSTITUCIONAIS:edu.br,edu,ac.br}

app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}

app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.storage.s3.prefix=${S3_PREFIX:anuncios}
app.storage.local.diretorio=${STORAGE_LOCAL_DIR:${java.io.tmpdir}/desapego-uploads}
app.storage.local.caminho-publico=/uploads
app.storage.max-imagens=${STORAGE_MAX_IMAGENS:5}
app.storage.max-tamanho=${STORAGE_MAX_TAMANHO:2MB}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:25MB}

app.fcm.credentials=${FCM_CREDENTIALS:}
app.fcm.project-id=${FCM_PROJECT_ID:}
app.fcm.scope=${FCM_SCOPE:https://www.googleapis.com/auth/firebase.messaging}
app.fcm.oauth-url=${FCM_OAUTH_URL:https://oauth2.googleapis.com/token}
app.fcm.send-url=${FCM_SEND_URL:https://fcm.googleapis.com/v1}
app.fcm.device-ttl=${FCM_DEVICE_TTL:P90D}
app.fcm.cleanup-lote=${FCM_CLEANUP_LOTE:500}

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.json
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operations-sorted-by=method
springdoc.default-produces-media-type=application/json

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30s

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:1.0.0}
info.app.description=Marketplace universitario Desapego

logging.structured.format.console=${LOG_FORMAT:logstash}
logging.structured.json.context.include=true
logging.structured.json.context.prefix=
