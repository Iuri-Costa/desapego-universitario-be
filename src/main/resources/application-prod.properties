spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
logging.level.root=${LOG_LEVEL_ROOT:INFO}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://desapego-universitario-fe.onrender.com}

app.jwt.secret=${JWT_SECRET}

app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.fcm.credentials=${FCM_CREDENTIALS:}
app.fcm.project-id=${FCM_PROJECT_ID:}

app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1}

app.security.hsts-enabled=true
